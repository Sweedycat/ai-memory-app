name: Android preview APK (experimental)
on:
  push:
    branches:
      - security/backup-restore-transaction-design
      - security/backup-recovery-key-management
      - feature/contact-actions
      - feature/contact-export
      - development/omega-commercial-mvp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Only this founder-authorized request can auto-build the development branch.
    # Other development pushes skip all jobs; manual dispatch stays explicit.
    if: >-
      github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/development/omega-commercial-mvp' || (github.event_name == 'push' && github.event.head_commit.message == 'build: preview APK [APK_READY]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run typecheck
      - run: npm run test:unit

  android-apk:
    needs: verify
    if: >-
      github.run_attempt == 1 && (github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/development/omega-commercial-mvp' || (github.event_name == 'push' && github.event.head_commit.message == 'build: preview APK [APK_READY]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: github-test
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner image
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Validate reviewed checkpoint metadata
        id: checkpoint
        shell: bash
        run: |
          node <<'CHECKPOINT' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const config = require('./app.config.js')({ config: app });
          if (config.android?.package !== 'com.sweedycat.aimemory.githubtest') throw Error('Unexpected APK package');
          if (!/^\d+\.\d+\.\d+$/.test(config.version) || pkg.version !== config.version ||
              lock.version !== config.version || lock.packages?.['']?.version !== config.version) throw Error('Inconsistent APK version');
          // Last verified/reported delivered candidate: code 2. Recheck the latest
          // actual artifact before every increment; this floor is not release history.
          if (!Number.isSafeInteger(config.android.versionCode) || config.android.versionCode <= 3) throw Error('APK update code must exceed verified baseline 3');
          console.log('version=' + config.version);
          console.log('version_code=' + config.android.versionCode);
          CHECKPOINT
      - name: Assert isolated package identity
        run: |
          grep -Eq "applicationId[[:space:]]+['\"]com[.]sweedycat[.]aimemory[.]githubtest['\"]" android/app/build.gradle
          ! grep -Eq "applicationId[[:space:]]+['\"]com[.]sweedycat[.]aimemory[.]preview['\"]" android/app/build.gradle
      - name: Build standalone release APK with bundled JavaScript
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Verify release APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Verify APK identity, signature and integrity before upload
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.checkpoint.outputs.version }}
          EXPECTED_CODE: ${{ steps.checkpoint.outputs.version_code }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
          cat "$RUNNER_TEMP/apk-signature.txt"
          grep -Fxq 'Number of signers: 1' "$RUNNER_TEMP/apk-signature.txt"
          test "$(grep -Eic '^(Signer #1 |V2 Signer: )certificate SHA-256 digest: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c$' "$RUNNER_TEMP/apk-signature.txt")" -eq 1
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
          head -n 1 "$RUNNER_TEMP/apk-badging.txt"
          node -e 'const fs=require("node:fs");const first=fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/)[0];const m=/^package: name=\x27([^\x27]+)\x27 versionCode=\x27(\d+)\x27 versionName=\x27([^\x27]+)\x27(?:\s|$)/.exec(first);if(!m||m[1]!=="com.sweedycat.aimemory.githubtest"||m[2]!==process.env.EXPECTED_CODE||m[3]!==process.env.EXPECTED_VERSION)throw Error("APK identity mismatch");' "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-memory-isolated-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
