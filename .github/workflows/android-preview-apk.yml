name: Android preview APK (experimental)
on:
  push:
    branches:
      - security/backup-restore-transaction-design
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  android-apk:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: github-test
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK from runner image
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
      - run: npm ci
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Assert isolated package identity
        run: |
          grep -Eq "applicationId[[:space:]]+['\"]com[.]sweedycat[.]aimemory[.]githubtest['\"]" android/app/build.gradle
          ! grep -Eq "applicationId[[:space:]]+['\"]com[.]sweedycat[.]aimemory[.]preview['\"]" android/app/build.gradle
      - name: Build standalone release APK with bundled JavaScript
        working-directory: android
        run: bash ./gradlew assembleRelease --no-daemon
      - name: Verify release APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-memory-isolated-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
