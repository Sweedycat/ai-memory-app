name: Omega portability verification
on:
  push:
    branches: [development/omega-commercial-mvp]
  pull_request:
    branches: [development/omega-commercial-mvp]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test portable tooling and existing hooks
        run: node --test tests/omegaRuntime.test.cjs tests/omegaCloudBootstrap.test.cjs tests/omegaCloudLauncher.test.cjs .codex/hooks/omega-hooks.test.cjs
      - name: Validate preserved skill definitions
        run: node .codex/verify-skills.cjs
      - name: Check Cloud launcher syntax
        if: runner.os == 'Linux'
        run: bash -n .codex/cloud/setup.sh
