name: Temporary dependency remediation probe

on:
  push:
    branches:
      - fix/fail-closed-local-memory-restore

permissions:
  contents: write

jobs:
  probe:
    if: github.repository == 'Sweedycat/ai-memory-app'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install current locked dependencies
        run: npm ci
      - name: Resolve non-breaking audit fixes in disposable runner
        shell: bash
        run: |
          npm audit fix --package-lock-only --no-fund --no-audit || true
          echo "--- Package-lock change summary ---"
          git diff --numstat -- package-lock.json
          echo "--- Audit after non-breaking lock update ---"
          npm audit --json > "$RUNNER_TEMP/audit-after.json" || true
          node - "$RUNNER_TEMP/audit-after.json" <<'NODE'
          const report = require(process.argv[2]);
          console.log('AFTER:', JSON.stringify(report.metadata?.vulnerabilities || {}));
          for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
            console.log(JSON.stringify({
              name, severity: v.severity, direct: v.isDirect,
              fixAvailable: v.fixAvailable,
            }));
          }
          NODE
      - name: Confirm refreshed lock installs and SDK alignment
        run: |
          npm ci
          npm run doctor
          npm run typecheck
          npm run test:unit
      - name: Commit lockfile-only safe fixes
        shell: bash
        run: |
          git diff --exit-code -- package.json
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh compatible transitive packages after dependency security review"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
