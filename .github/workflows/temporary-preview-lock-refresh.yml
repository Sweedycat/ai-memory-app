name: Temporary preview dependency lock refresh

on:
  push:
    branches: [preview]

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Sweedycat/ai-memory-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lock without changing package manifest or Expo SDK
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
      - name: Verify full locked install and Expo alignment
        run: |
          npm ci
          npm run doctor
          npm run typecheck
          npm run test:unit
      - name: Commit validated lockfile on preview only
        shell: bash
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Lock supported expo-crypto dependency on preview"
            git push origin "HEAD:preview"
          fi
