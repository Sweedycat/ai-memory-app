name: TypeScript check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo SDK dependency alignment
        run: npm run doctor

      - name: Type-check app
        run: npm run typecheck

      - name: Test local-memory restoration
        run: npm run test:unit
