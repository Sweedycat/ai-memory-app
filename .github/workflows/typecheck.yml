name: TypeScript check

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo SDK dependency alignment
        run: npm run doctor

      - name: Type-check app
        run: npm run typecheck

      - name: Test local-memory restoration
        run: npm run test:unit

      - name: List dependency security advisories (informational)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/ai-memory-audit.json" || true
          node - "$RUNNER_TEMP/ai-memory-audit.json" <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          } catch (error) {
            console.log('Could not read npm audit report: ' + error.message);
            process.exit(0);
          }
          console.log('Dependency audit inventory (not yet a release gate):');
          console.log(JSON.stringify(report.metadata?.vulnerabilities || {}, null, 2));
          for (const [name, info] of Object.entries(report.vulnerabilities || {})) {
            const via = (info.via || [])
              .filter((v) => typeof v === 'object')
              .map((v) => ({ title: v.title, url: v.url, range: v.range }));
            console.log(JSON.stringify({
              name,
              severity: info.severity,
              direct: info.isDirect,
              range: info.range,
              fixAvailable: info.fixAvailable,
              via,
            }));
          }
          NODE
